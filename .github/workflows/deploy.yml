name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Hetzner Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment to api.travlogue.in..."

            # Navigate to project directory
            cd /bionics/projects/logbook

            # Pull latest changes
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main

            # Activate virtual environment and install dependencies
            echo "📦 Installing/updating dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            # Run database migrations
            echo "🗄️  Running database migrations..."
            alembic upgrade head

            # Restart the systemd service
            echo "🔄 Restarting logbook service..."
            sudo systemctl restart logbook

            # Wait for service to start
            sleep 3

            # Check service status
            echo "✅ Checking service status..."
            sudo systemctl is-active --quiet logbook && echo "Service is running!" || echo "⚠️ Service failed to start"

            # Test the API
            echo "🧪 Testing API health endpoint..."
            curl -f https://api.travlogue.in/health || echo "⚠️ Health check failed"

            echo "🎉 Deployment complete!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment succeeded!"
          else
            echo "❌ Deployment failed!"
          fi
