# Nginx configuration for Logbook API
# Deploy to: /etc/nginx/sites-available/logbook.conf
# Then create symlink: sudo ln -s /etc/nginx/sites-available/logbook.conf /etc/nginx/sites-enabled/

upstream logbook_backend {
    server 127.0.0.1:8000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.travlogue.in;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.travlogue.in;

    # SSL certificates (adjust paths based on your setup - Let's Encrypt/Certbot)
    ssl_certificate /etc/letsencrypt/live/api.travlogue.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.travlogue.in/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Logging
    access_log /var/log/nginx/logbook_access.log;
    error_log /var/log/nginx/logbook_error.log;

    # Client body size (for file uploads)
    client_max_body_size 10M;

    # Proxy all API requests to FastAPI backend
    location / {
        proxy_pass http://logbook_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
