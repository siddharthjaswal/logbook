[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v                          # Verbose output
    --strict-markers            # Raise error on unknown markers
    --tb=short                  # Shorter traceback format
    --cov=app                   # Coverage for app directory
    --cov-report=term-missing   # Show missing lines in coverage
    --cov-report=html           # Generate HTML coverage report
    --cov-fail-under=80         # Fail if coverage below 80%

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, use database)
    auth: Authentication tests
    trips: Trip-related tests
    slow: Slow running tests

# Asyncio mode
asyncio_mode = auto
